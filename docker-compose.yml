services:
  tuya-local-connect:
    # Pull da imagem publicada no registry do homelab.
    image: homeserver:32081/tuya-local-connect:latest
    # Para gerar a imagem localmente, descomente o bloco abaixo e troque a imagem
    # para "tuya-local-connect:latest".
    # build:
    #   context: .
    #   dockerfile: MqttThSensorWorker/Dockerfile
    container_name: tuya-local-connect
    restart: unless-stopped
    # Rede do host: o discovery depende de broadcast UDP (6667) na LAN dos devices.
    network_mode: host
    environment:
      - DOTNET_ENVIRONMENT=Production
      # Devices e broker vêm do appsettings.json embutido na imagem; as LocalKeys, do
      # appsettings.local.json (fora do git, copiado para a imagem no build).
      # Variáveis TuyaApi__Devices__N__* sobrescrevem o device da posição N — use só para ajustes pontuais.
    volumes:
      - tuya-logs:/app/Logs

volumes:
  tuya-logs:
