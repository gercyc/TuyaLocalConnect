; ============================================================
;  TuyaEsp32Meter — ponte Tuya LAN -> MQTT/Home Assistant em ESP32
;
;    pio run -t upload        grava
;    pio device monitor       serial (115200)
;
;  Devices e settings ficam na NVS e sao editados pela pagina web:
;  adicionar um device nao exige recompilar.
; ============================================================

[env:esp32dev]
platform      = espressif32 @ 7.0.1
board         = esp32dev
framework     = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed  = 921600

; App de ate 1.9MB com OTA: o default (1.2MB) fica apertado com
; WiFi + WebServer + mbedTLS + MQTT.
board_build.partitions = min_spiffs.csv

lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
    knolleary/PubSubClient @ ^2.8

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D FW_VERSION='"1.0.0"'
